name: status

# Regenerates STATUS.md (and the generated README.md) and commits them.
#
# WHY A WORKFLOW AND NOT A SKILL. A skill for this existed — written, complete,
# never installed into any `.claude/skills/`, and therefore never run once. Even
# installed it would only fire when somebody thought to invoke it, and the
# defect being fixed is precisely that nobody did. STATUS.md was three days
# stale and named the wrong launch blocker. Don reads it from a phone; anything
# that needs a laptop and a person remembering is not a fix.
#
# ON THE SCHEDULE, because `process/LIVING-DOCS.md` refuses scheduled Actions:
# that refusal was aimed at a document that ACCUMULATES and rots between reads,
# and at a green tick indistinguishable from a job that stopped running. Neither
# applies here. STATUS.md is overwritten wholesale, so it cannot accumulate —
# and this job commits ONLY when the content actually changed, so a fresh date
# on the file always means a real change rather than a heartbeat. See the
# 2026-09-19 line in DECISIONS.md.

on:
  push:
    branches: [main]
    # Without this the job's own commit retriggers it. The second run would
    # find nothing changed and commit nothing, so it terminates either way —
    # but a run per run is noise, and noise is what gets muted.
    paths-ignore:
      - STATUS.md
      - README.md
  schedule:
    - cron: '5 13 * * *'   # 13:05 UTC, just after socialus-web's deploy-health
  workflow_dispatch:

# Not cancel-in-progress: a cancelled run can be one that was mid-push.
concurrency:
  group: status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate STATUS.md
    # PINNED, not ubuntu-latest, matching socialus-web. The `ubuntu-latest`
    # label migrates to Ubuntu 26 from 2026-10-19 — eleven days before launch.
    # This pins what is already proven rather than adopting anything new.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Both checkouts land as siblings, because that is the layout
      # scripts/state.sh expects: it resolves the code repo at ../socialus-web.
      - name: Check out the planning repo
        uses: actions/checkout@v5
        with:
          path: ops-pattern
          fetch-depth: 0          # state.sh reads history, not just the tip

      # THE ONE THING THAT NEEDS A HUMAN. Both repos are private, so the
      # workflow's own GITHUB_TOKEN cannot see socialus-web at all — not its
      # issues, not its code, not its CI. A fine-grained PAT with read access
      # to donlafranchi/socialus-web, stored here as SOCIALUS_WEB_TOKEN, is the
      # only way across.
      #
      # Without it this job still runs and still commits: STATUS.md regenerates
      # from this repo's own sources and says plainly, at the top and again at
      # the bottom, that everything about the code repo is missing. A thinner
      # file that announces what it is missing beats a red tick nobody can fix
      # from a phone.
      - name: Is the cross-repo token present?
        id: gate
        env:
          T: ${{ secrets.SOCIALUS_WEB_TOKEN }}
        run: |
          if [ -n "$T" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SOCIALUS_WEB_TOKEN is not set. STATUS.md will regenerate without anything from socialus-web — open issues, merges, the ontology registry and CI's last word. Add a fine-grained PAT with read access to donlafranchi/socialus-web as a repository secret named SOCIALUS_WEB_TOKEN."
          fi

      - name: Check out the code repo, read-only
        if: steps.gate.outputs.have == 'true'
        uses: actions/checkout@v5
        with:
          repository: donlafranchi/socialus-web
          path: socialus-web
          fetch-depth: 0
          token: ${{ secrets.SOCIALUS_WEB_TOKEN }}

      - name: Regenerate STATUS.md
        working-directory: ops-pattern
        env:
          # `gh` reads issues, PRs and workflow runs in the private code repo.
          # The default GITHUB_TOKEN cannot; state.sh refuses to guess and says
          # so rather than emitting a confident empty list.
          GH_TOKEN: ${{ secrets.SOCIALUS_WEB_TOKEN }}
        run: bash scripts/status.sh

      # README.md is generated by view.sh and, until now, nothing invoked that
      # either — the same defect, the same fix. It is how Don reads the accepted
      # risks on a phone without a checkout. It needs the code repo's issues, so
      # it is skipped rather than half-written when the token is absent.
      - name: Regenerate README.md
        if: steps.gate.outputs.have == 'true'
        working-directory: ops-pattern
        env:
          GH_TOKEN: ${{ secrets.SOCIALUS_WEB_TOKEN }}
        run: bash scripts/view.sh

      - name: Commit, but only if the content changed
        working-directory: ops-pattern
        run: |
          set -euo pipefail
          git config user.name  'status workflow'
          git config user.email 'actions@github.com'

          # A plain `git diff` is useless here: STATUS.md carries the time it
          # was generated, so every run differs from every other run and the
          # file would be committed on a schedule regardless of whether one
          # fact had moved. Compare with that line blanked out.
          #
          # The launch countdown is deliberately NOT normalised away. It is
          # content, and a countdown that only moves when something else does
          # is a lie. So the day rolling over is itself a change — which caps
          # this at one commit a day when nothing else happens, and means a new
          # revision of this file is never a bare heartbeat.
          norm() { sed -E 's/^> ## Generated .*/> ## Generated/' "$1"; }

          changed=0
          for f in STATUS.md README.md; do
            [ -f "$f" ] || continue
            if ! git show "HEAD:$f" > /tmp/prev.md 2>/dev/null; then changed=1; break; fi
            norm /tmp/prev.md > /tmp/a.md
            norm "$f"         > /tmp/b.md
            cmp -s /tmp/a.md /tmp/b.md || { changed=1; break; }
          done

          if [ "$changed" -eq 0 ]; then
            echo "::notice::Nothing moved. Not committed — so a new revision of STATUS.md always means something did."
            exit 0
          fi

          git add STATUS.md README.md
          git commit -m 'docs: regenerate STATUS.md'

          # `HEAD:main` explicitly: actions/checkout leaves the branch without an
          # upstream, so a bare `git push` fails with "no upstream branch".
          #
          # A push can also lose a race with a human merge. Rebase and retry
          # once; a second failure is real and should be seen.
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
          echo "::notice::STATUS.md changed and was committed."
